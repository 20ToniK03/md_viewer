<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Viewer</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js" defer></script>
<style>
  :root {
    --font-size: 16px;
    --top-h: 54px;
    --toc-width: 280px;
    --content-max: 1220px;
    --radius: 10px;
  }

  /* ---------- палитры (значения по умолчанию = GitHub; остальные ставит JS) ---------- */
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-2: #f6f8fa;
    --fg: #1f2328;
    --muted: #59636e;
    --border: #d1d9e0;
    --accent: #0969da;
    --accent-2: #218bff;
    --accent-soft: #ddf4ff;
    --code-bg: #f6f8fa;
    --head-bg: #f6f8fa;
    --top-bg: #24292f;
    --top-fg: #ffffff;
    --grid: #d7dee8;
    --shadow: 0 10px 30px rgba(31, 35, 40, .12);
    --shadow-sm: 0 2px 8px rgba(31, 35, 40, .10);
    --tip-bg: #1f2328;
    --tip-fg: #ffffff;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    --font-head: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    color: var(--fg);
    background: var(--bg);
    font-family: var(--font-body);
    font-size: var(--font-size);
    line-height: 1.62;
    transition: background .18s ease, color .18s ease;
  }

  /* ---------- кастомный скроллбар (основной и вложенные) ---------- */
  * { scrollbar-width: thin; scrollbar-color: var(--accent) transparent; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--muted) 42%, transparent);
    border-radius: 8px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--accent);
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-corner { background: transparent; }

  /* ---------- верхняя панель ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 10px;
    height: var(--top-h);
    padding: 0 18px;
    background: var(--top-bg);
    color: var(--top-fg);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .topbar .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
    flex: 0 0 auto;
  }
  .topbar .title { font-weight: 700; font-size: 15px; white-space: nowrap; letter-spacing: .01em; }
  .topbar .sub {
    color: color-mix(in srgb, var(--top-fg) 70%, transparent);
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .tb-btn {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--top-fg);
    background: color-mix(in srgb, var(--top-fg) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--top-fg) 24%, transparent);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .tb-btn:hover { background: color-mix(in srgb, var(--top-fg) 18%, transparent); border-color: color-mix(in srgb, var(--top-fg) 40%, transparent); }
  .tb-btn:active { transform: translateY(1px); }
  .tb-btn.icon { padding: 7px 10px; display: inline-flex; align-items: center; justify-content: center; }
  .tb-btn svg, .mermaid-toolbar button svg, .code-copy svg { display: block; }
  @keyframes gearSpin { from { transform: rotate(0deg); } to { transform: rotate(180deg); } }
  #settings-btn.spin svg { animation: gearSpin .45s cubic-bezier(.4, 0, .2, 1); }

  /* ---------- панель настроек ---------- */
  .menu-wrap { position: relative; }
  .settings-pop {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 60;
    width: 332px;
    max-width: calc(100vw - 24px);
    background: var(--panel);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    display: none;
    overflow: hidden;
  }
  .settings-pop.open { display: block; animation: pop .12s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .sp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
    font-size: 13px;
  }
  .sp-head button {
    border: 0;
    background: none;
    color: var(--muted);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
    border-radius: 4px;
  }
  .sp-head button:hover { color: var(--fg); background: var(--accent-soft); }
  .sp-body { padding: 12px 14px 14px; max-height: 70vh; overflow-y: auto; }
  .sp-group { margin-bottom: 15px; }
  .sp-group:last-child { margin-bottom: 0; }
  .sp-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .theme-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 9px;
    font: inherit;
    font-size: 12.5px;
    color: var(--fg);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    transition: border-color .15s ease, background .15s ease;
  }
  .theme-btn:hover { border-color: var(--accent); }
  .theme-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .theme-btn .sw {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    flex: 0 0 auto;
  }
  .theme-btn .sw { border-color: var(--accent); }
  .theme-btn > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  select, input[type="range"] { width: 100%; font: inherit; }
  select {
    color: var(--fg);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 9px;
    font-size: 13px;
  }
  input[type="range"] { accent-color: var(--accent); }
  .range-row { display: flex; align-items: center; gap: 10px; }
  .range-row output { min-width: 46px; text-align: right; font-size: 12.5px; color: var(--muted); }
  .sp-check { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; line-height: 1.4; cursor: pointer; }
  .sp-check input { accent-color: var(--accent); margin-top: 2px; }
  .sp-reset {
    width: 100%;
    margin-top: 4px;
    padding: 8px 10px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  .sp-reset:hover { color: var(--accent); border-color: var(--accent); }

  /* ---------- каркас ---------- */
  .layout {
    display: grid;
    grid-template-columns: var(--toc-width) 6px minmax(0, 1fr);
    align-items: start;
    padding-top: 14px;
    transition: grid-template-columns .28s cubic-bezier(.4, 0, .2, 1);
  }
  .layout.no-transition { transition: none; }
  /* жёсткая привязка к колонкам, чтобы при скрытии панели контент не сползал в колонку 1 */
  .toc-panel { grid-column: 1; grid-row: 1; min-width: 0; }
  .splitter { grid-column: 2; grid-row: 1; overflow: hidden; }
  main.content { grid-column: 3; grid-row: 1; }
  .layout.toc-collapsed { grid-template-columns: 0px 0px minmax(0, 1fr); }
  .layout.toc-collapsed .toc-panel { border: 0; }

  .toc-panel {
    position: sticky;
    top: calc(var(--top-h) + 14px);
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - var(--top-h) - 14px);
    border: 1px solid var(--border);
    border-left: 0;
    border-radius: 0 12px 12px 0;
    background: var(--panel);
    overflow: hidden;
  }
  .toc-head {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 7px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  .toc-tabs {
    position: relative;
    display: flex;
    gap: 4px;
    flex: 1 1 auto;
    min-width: 0;
  }
  .toc-indicator {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: 7px;
    transition: transform .24s cubic-bezier(.4, 0, .2, 1), width .24s cubic-bezier(.4, 0, .2, 1);
    z-index: 0;
    pointer-events: none;
  }
  .toc-tabs.has-folder .toc-indicator { width: 50%; }
  .toc-tabs.folder-active .toc-indicator { transform: translateX(100%); }
  .toc-tab {
    position: relative;
    z-index: 1;
    flex: 1 1 auto;
    padding: 6px 6px;
    font: inherit;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
    text-align: center;
    transition: color .15s ease, background .15s ease;
  }
  .toc-tab:hover:not(.active) { color: var(--fg); background: var(--accent-soft); }
  .toc-tab.active { color: var(--accent); }
  .toc-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  nav.toc {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 10px 10px 30px;
    font-size: 13px;
  }
  nav.toc a {
    display: block;
    padding: 4px 8px;
    color: var(--muted);
    text-decoration: none;
    border-radius: 6px;
    border-left: 3px solid transparent;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  nav.toc a:hover { color: var(--accent); background: var(--accent-soft); }
  nav.toc a.lvl-1 { font-weight: 700; color: var(--fg); margin-top: 9px; }
  nav.toc a.lvl-2 { padding-left: 18px; }
  nav.toc a.lvl-3 { padding-left: 30px; font-size: 12px; }
  nav.toc[hidden] { display: none; }

  /* ---------- рабочая папка ---------- */
  nav.folder {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 8px 24px;
    font-size: 13px;
  }
  nav.folder[hidden] { display: none; }
  .folder-empty {
    padding: 16px 12px;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.55;
    text-align: center;
  }
  .folder-root {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 8px 7px;
    margin-bottom: 3px;
    font-weight: 700;
    font-size: 13px;
    color: var(--fg);
  }
  .folder-root svg { flex: 0 0 auto; color: var(--accent); }
  .folder-root .fname {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  ul.file-tree { list-style: none; margin: 0; padding: 0 0 0 20px; }
  ul.file-tree ul {
    list-style: none;
    margin: 0 0 0 12px;
    padding: 0 0 0 14px;
    border-left: 1px solid var(--border);
  }
  ul.file-tree ul > li > :is(button, .file-other) {
    position: relative;
  }
  ul.file-tree ul > li > :is(button, .file-other)::before {
    content: "";
    position: absolute;
    left: -15px;
    top: 50%;
    width: 18px;
    height: 1px;
    transform: translateY(-50%);
    background: var(--border);
  }
  .file-tree li { margin: 0; }
  .file-tree li.closed > ul { display: none; }
  .file-tree button {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    padding: 3px 8px;
    font: inherit;
    font-size: 13px;
    color: var(--fg);
    background: transparent;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    text-align: left;
    overflow: hidden;
  }
  .file-tree button:hover { background: var(--accent-soft); }
  .file-tree button svg { flex: 0 0 auto; color: var(--muted); }
  .file-tree .dir-toggle { font-weight: 600; }
  .file-tree .dir-toggle .tw {
    flex: 0 0 auto;
    width: 11px;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    transition: transform .12s ease;
  }
  .file-tree li.open > .dir-toggle .tw { transform: rotate(90deg); }
  .file-tree .file-btn { color: var(--muted); }
  .file-tree .file-btn.md { color: var(--fg); }
  .file-tree .file-btn.md svg { color: var(--accent); }
  .file-tree .fname {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-tree .file-other {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 8px;
    color: var(--muted);
    opacity: .72;
    overflow: hidden;
  }
  .file-tree .file-other svg { flex: 0 0 auto; }

  /* ---------- анимации ---------- */
  @keyframes panelIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes contentIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  nav.toc.panel-enter, nav.folder.panel-enter { animation: panelIn .22s ease; }
  main.content.content-enter { animation: contentIn .26s ease; }
  @media (prefers-reduced-motion: reduce) {
    nav.toc.panel-enter, nav.folder.panel-enter, main.content.content-enter { animation: none; }
  }

  .splitter {
    position: sticky;
    top: calc(var(--top-h) + 14px);
    height: calc(100vh - var(--top-h) - 14px);
    cursor: col-resize;
    background: transparent;
    transition: background .15s ease;
  }
  .splitter::after {
    content: "";
    position: absolute;
    left: 2px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--border);
    border-radius: 2px;
  }
  .splitter:hover::after, .splitter.dragging::after { background: var(--accent); }
  body.dragging { user-select: none; cursor: col-resize; }

  main.content {
    width: 100%;
    max-width: var(--content-max);
    margin: 0 auto;
    padding: 4px 34px 90px;
    min-width: 0;
  }
  main.content > h1:first-child { margin-top: 0; }

  .empty { margin-top: 46px; text-align: center; color: var(--muted); }
  .empty .big { font-size: 21px; color: var(--fg); font-weight: 700; }
  .empty ul { list-style: none; padding: 0; display: inline-block; text-align: left; color: var(--muted); }

  h1, h2, h3, h4 { line-height: 1.25; scroll-margin-top: calc(var(--top-h) + 16px); overflow-wrap: anywhere; font-family: var(--font-head, var(--font-body)); }
  h1 { font-size: 1.85em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  h2 { font-size: 1.36em; border-bottom: 1px solid var(--border); padding-bottom: .3em; margin-top: 1.6em; }
  h3 { font-size: 1.14em; margin-top: 1.4em; }
  h4 { font-size: 1em; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  code {
    font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, "Courier New", monospace;
    font-size: .88em;
    background: var(--code-bg);
    padding: .15em .38em;
    border-radius: 6px;
    overflow-wrap: anywhere;
  }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 16px 18px;
    border-radius: 10px;
    overflow-x: auto;
    line-height: 1.5;
  }
  pre code { background: transparent; padding: 0; font-size: .84em; }
  body.wrap-code pre code { white-space: pre-wrap; overflow-wrap: anywhere; }

  .code-block { position: relative; margin: 14px 0; }
  .code-block pre { margin: 0; }
  .code-block .code-copy {
    position: absolute;
    top: 8px;
    right: 8px;
    padding: 3px 10px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s ease, color .15s ease, border-color .15s ease;
  }
  .code-block:hover .code-copy { opacity: 1; }
  .code-block .code-copy:hover { color: var(--accent); border-color: var(--accent); }

  table { border-collapse: collapse; width: 100%; margin: 14px 0; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
  th { background: var(--head-bg); font-weight: 700; }
  tbody tr:nth-child(2n) td { background: color-mix(in srgb, var(--panel-2) 70%, transparent); }

  blockquote {
    margin: 14px 0;
    padding: 2px 16px;
    border-left: 4px solid var(--accent);
    color: var(--muted);
    background: var(--panel-2);
    border-radius: 0 8px 8px 0;
  }
  hr { border: 0; border-top: 1px solid var(--border); margin: 28px 0; }
  ul, ol { padding-left: 1.6em; }
  img { max-width: 100%; height: auto; }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 4px dashed var(--accent);
    color: var(--accent);
    font-size: 28px;
    font-weight: 800;
    pointer-events: none;
  }
  .overlay.visible { display: flex; }

  /* ---------- mermaid ---------- */
  .mermaid-box {
    position: relative;
    margin: 16px 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .mermaid-toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
    flex-wrap: wrap;
  }
  .mermaid-toolbar button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    height: 28px;
    padding: 0 8px;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    color: var(--fg);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .mermaid-toolbar button:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .mermaid-toolbar button.pct { min-width: 56px; }
  .mermaid-toolbar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
  .mermaid-toolbar .hint { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .mermaid-viewport {
    position: relative;
    display: flex;
    height: 380px;
    overflow: auto;
    cursor: grab;
    background-color: var(--panel);
    background-image: radial-gradient(circle, var(--grid) 1px, transparent 1px);
    background-size: 20px 20px;
    overscroll-behavior: contain;
    scrollbar-width: none;
    -ms-overflow-style: none;
    scroll-behavior: auto;
  }
  .mermaid-viewport::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .mermaid-viewport.panning { cursor: grabbing; }
  .mermaid-inner { margin: auto; padding: 16px; transform-origin: center center; }
  .mermaid-inner svg { display: block; max-width: none !important; height: auto; }
  .mermaid-box:fullscreen {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    margin: 0;
    border: 0;
    border-radius: 0;
  }
  .mermaid-box:fullscreen .mermaid-viewport { flex: 1 1 auto; height: auto !important; }
  .mermaid-box:fullscreen .mermaid-inner { background: transparent; }

  /* ограничение подписей узлов: не даём тексту вылезать за блок */
  .mermaid-inner .nodeLabel,
  .mermaid-inner .nodeLabel p {
    white-space: normal !important;
    overflow-wrap: anywhere !important;
    word-break: break-word;
    text-align: center;
    line-height: 1.3 !important;
    margin: 0 !important;
  }
  .mermaid-inner .nodeLabel {
    display: -webkit-box !important;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden !important;
    max-width: 210px;
    max-height: 5.4em;
    padding: 0 2px;
  }
  .mermaid-inner .edgeLabel,
  .mermaid-inner .edgeLabel span,
  .mermaid-inner .edgeLabel div {
    white-space: normal !important;
    overflow-wrap: anywhere !important;
    max-width: 230px;
  }

  .mermaid-toast, .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(24px) scale(.95);
    z-index: 90;
    background: var(--tip-bg);
    color: var(--tip-fg);
    padding: 9px 15px;
    border-radius: 9px;
    font-size: 13px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .3s cubic-bezier(.34, 1.56, .64, 1);
    max-width: min(520px, calc(100vw - 30px));
  }
  .mermaid-toast.show, .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

  .mermaid-error {
    margin: 14px 0;
    padding: 10px 14px;
    color: #b91c1c;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  html[data-scheme="dark"] .mermaid-error {
    color: #fecaca;
    background: #3b0d0d;
    border-color: #7f1d1d;
  }

  /* подсказка с полным текстом узла */
  .node-tip {
    position: fixed;
    z-index: 120;
    max-width: min(440px, calc(100vw - 24px));
    padding: 8px 11px;
    background: var(--tip-bg);
    color: var(--tip-fg);
    border-radius: 8px;
    font-size: 12.5px;
    line-height: 1.45;
    box-shadow: var(--shadow);
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .1s ease, transform .1s ease;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .node-tip.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 980px) {
    :root { --toc-width: 230px; }
    main.content { padding: 4px 20px 80px; }
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; transition: none; }
    .splitter { display: none; }
    .toc-panel {
      position: static;
      max-height: 45vh;
      border: 0;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
    }
    .layout.toc-collapsed { grid-template-columns: 1fr; }
    .layout.toc-collapsed .toc-panel { display: none; border: 0; }
    main.content { grid-column: 1; grid-row: 2; padding: 16px; max-width: none; }
    .topbar .sub { display: none; }
  }
  @media (max-width: 560px) {
    .topbar { padding: 0 10px; }
    .tb-btn { padding: 6px 8px; font-size: 12px; }
    .mermaid-toolbar .hint { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <span class="dot"></span>
  <span class="title">Markdown Viewer</span>
  <span class="sub" id="file-name">файл не выбран</span>
  <div class="top-actions">
    <button type="button" class="tb-btn icon" id="toc-top-toggle" title="Скрыть оглавление" aria-label="Скрыть оглавление" aria-pressed="true"></button>
    <button type="button" class="tb-btn icon" id="open-btn" title="Добавить файл" aria-label="Добавить файл"></button>
    <button type="button" class="tb-btn icon" id="open-folder-btn" title="Добавить папку" aria-label="Добавить папку"></button>
    <div class="menu-wrap">
      <button type="button" class="tb-btn icon" id="settings-btn" title="Настройки" aria-label="Настройки" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-pop"></button>
      <div class="settings-pop" id="settings-pop" role="dialog" aria-label="Настройки вида">
        <div class="sp-head">
          <b>Настройки вида</b>
          <button type="button" id="settings-close" title="Закрыть" aria-label="Закрыть настройки">&times;</button>
        </div>
        <div class="sp-body">
          <div class="sp-group">
            <div class="sp-label">Тема</div>
            <div class="theme-grid" id="theme-grid"></div>
          </div>
          <div class="sp-group">
            <label class="sp-label" for="font-select">Шрифт текста</label>
            <select id="font-select">
              <option value="auto">Из темы (рекомендуется)</option>
              <option value="sans">Системный (Segoe UI)</option>
              <option value="serif">С засечками (Georgia)</option>
              <option value="humanist">Гуманистический (Candara)</option>
              <option value="mono">Моноширинный</option>
            </select>
          </div>
          <div class="sp-group">
            <label class="sp-label" for="size-range">Размер текста</label>
            <div class="range-row">
              <input type="range" id="size-range" min="14" max="22" step="1">
              <output id="size-val" for="size-range">16 px</output>
            </div>
          </div>
          <div class="sp-group">
            <label class="sp-check"><input type="checkbox" id="tip-check"> Показывать полный текст узлов при наведении</label>
          </div>
          <div class="sp-group">
            <label class="sp-check"><input type="checkbox" id="wrap-check"> Переносить длинные строки в блоках кода</label>
          </div>
          <button type="button" class="sp-reset" id="settings-reset">Сбросить настройки</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="layout" id="layout">
  <aside class="toc-panel">
    <div class="toc-head">
      <div class="toc-tabs" role="tablist">
        <span class="toc-indicator" aria-hidden="true"></span>
        <button type="button" class="toc-tab active" id="tab-toc" role="tab" aria-selected="true" aria-controls="toc">Оглавление</button>
        <button type="button" class="toc-tab" id="tab-folder" role="tab" aria-selected="false" aria-controls="folder" hidden>Рабочая папка</button>
      </div>
    </div>
    <nav class="toc" id="toc" role="tabpanel"></nav>
    <nav class="folder" id="folder" role="tabpanel" hidden></nav>
  </aside>
  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" title="Перетащите, чтобы изменить ширину. Двойной клик - сброс"></div>
  <main class="content" id="content">
    <div class="empty">
      <div class="big">Откройте Markdown-файл, чтобы увидеть его оформленным</div>
      <ul>
        <li>перетащите файл или папку прямо на страницу</li>
        <li>или нажмите на кнопки файла/папки вверху</li>
      </ul>
    </div>
  </main>
</div>

<input type="file" id="file-input" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
<input type="file" id="folder-input" webkitdirectory hidden>
<div class="overlay" id="overlay">Отпустите файл или папку, чтобы открыть</div>
<div class="node-tip" id="node-tip" role="tooltip"></div>
<div class="toast" id="toast"></div>

  /* ---------- настройки ---------- */
  function loadSettings() {
    var s = {};
    try {
      s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") || {};
    } catch (e) { s = {}; }
    var out = {};
    Object.keys(DEFAULTS).forEach(function (k) {
      out[k] = (s[k] === undefined) ? DEFAULTS[k] : s[k];
    });
    var known = THEMES.some(function (t) { return t.id === out.theme; });
    if (!known) { out.theme = DEFAULTS.theme; }
    var knownFont = FONTS.some(function (f) { return f.id === out.font; });
    if (!knownFont) { out.font = DEFAULTS.font; }
    return out;
  }
  var settings = loadSettings();

  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
  }

  function buildThemeButtons() {
    THEMES.forEach(function (t) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "theme-btn";
      btn.setAttribute("data-theme-id", t.id);
      btn.title = t.desc;
      btn.innerHTML = '<span class="sw" style="background:' + t.sw + ';border-color:' + t.swa + '"></span><span>' + t.name + "</span>";
      btn.addEventListener("click", function () {
        settings.theme = t.id;
        saveSettings();
        applySettings(true);
      });
      themeGrid.appendChild(btn);
    });
  }

  function syncSettingsControls() {
    Array.prototype.forEach.call(themeGrid.querySelectorAll(".theme-btn"), function (btn) {
      btn.setAttribute("aria-pressed", btn.getAttribute("data-theme-id") === settings.theme ? "true" : "false");
    });
    fontSelect.value = settings.font;
    sizeRange.value = String(settings.size);
    sizeVal.textContent = settings.size + " px";
    tipCheck.checked = !!settings.tooltips;
    wrapCheck.checked = !!settings.wrapCode;
  }

  function applySettings(rerenderDiagrams) {
    var t = themeById(settings.theme);
    var root = document.documentElement;
    var v = t.vars;
    Object.keys(v).forEach(function (k) {
      root.style.setProperty("--" + k, v[k]);
    });
    var font = FONTS.some(function (f) { return f.id === settings.font && f.id !== "auto"; })
      ? (FONTS.filter(function (f) { return f.id === settings.font; })[0].css)
      : t.fontBody;
    var headFont = (settings.font === "auto") ? (t.fontHead || t.fontBody) : font;
    root.style.setProperty("--font-body", font);
    root.style.setProperty("--font-head", headFont);
    root.setAttribute("data-theme", t.id);
    root.setAttribute("data-scheme", t.scheme);
    document.documentElement.style.setProperty("--font-size", settings.size + "px");
    document.body.classList.toggle("wrap-code", !!settings.wrapCode);
    if (!settings.tooltips) { hideNodeTip(); }
    syncSettingsControls();
    if (rerenderDiagrams) { scheduleMermaidRerender(); }
  }

  function scheduleMermaidRerender() {
    if (rerenderTimer) { clearTimeout(rerenderTimer); }
    rerenderTimer = setTimeout(function () {
      rerenderTimer = null;
      rerenderAllMermaid();
    }, 220);
  }

  /* ---------- верхние кнопки ---------- */
  openBtn.addEventListener("click", function () { fileInput.click(); });

  function openSettings() {
    settingsPop.classList.add("open");
    settingsBtn.setAttribute("aria-expanded", "true");
    // анимация шестерёнки
    settingsBtn.classList.remove("spin");
    void settingsBtn.offsetWidth;
    settingsBtn.classList.add("spin");
  }
  function closeSettings() {
    settingsPop.classList.remove("open");
    settingsBtn.setAttribute("aria-expanded", "false");
  }
  settingsBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (settingsPop.classList.contains("open")) { closeSettings(); } else { openSettings(); }
  });
  settingsClose.addEventListener("click", closeSettings);
  document.addEventListener("click", function (e) {
    if (settingsPop.classList.contains("open") && !e.target.closest(".menu-wrap")) { closeSettings(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeSettings(); hideNodeTip(); }
  });

  fontSelect.addEventListener("change", function () {
    settings.font = fontSelect.value;
    saveSettings();
    applySettings(true);
  });
  sizeRange.addEventListener("input", function () {
    settings.size = parseInt(sizeRange.value, 10) || 16;
    saveSettings();
    applySettings(false);
    sizeVal.textContent = settings.size + " px";
    scheduleMermaidRerender();
  });
  tipCheck.addEventListener("change", function () {
    settings.tooltips = tipCheck.checked;
    saveSettings();
    if (!settings.tooltips) { hideNodeTip(); }
  });
  wrapCheck.addEventListener("change", function () {
    settings.wrapCode = wrapCheck.checked;
    saveSettings();
    applySettings(false);

  settingsReset.addEventListener("click", function () {
    settings = Object.assign({}, DEFAULTS);

  /* ---------- оглавление и ширина ---------- */
  function applyTocWidth(width) {
    width = Math.round(width);
    width = Math.max(0, Math.min(MAX_TOC_WIDTH, width));
    if (width > 0 && width < SNAP_TO_ZERO) { width = 0; }
    else if (width > 0 && width < MIN_OPEN_WIDTH) { width = MIN_OPEN_WIDTH; }
    tocWidth = width;
    layout.style.setProperty("--toc-width", width + "px");
    var collapsed = width === 0;
    layout.classList.toggle("toc-collapsed", collapsed);
    toc.setAttribute("aria-hidden", collapsed ? "true" : "false");
    if (folderEl) { folderEl.setAttribute("aria-hidden", collapsed ? "true" : "false"); }
    if (!collapsed) { lastOpenWidth = width; }
    updateTocToggle(collapsed);
  }
  function updateTocToggle(collapsed) {
    if (tocTopToggle) {
      tocTopToggle.setAttribute("aria-pressed", collapsed ? "false" : "true");
      tocTopToggle.title = collapsed ? "Показать оглавление" : "Скрыть оглавление";
      tocTopToggle.setAttribute("aria-label", tocTopToggle.title);
      tocTopToggle.innerHTML = collapsed ? ICONS.toc : ICONS.tocActive;
    }
  }
  function toggleToc() {
    if (tocWidth === 0) { applyTocWidth(lastOpenWidth || DEFAULT_TOC_WIDTH); }
    else { applyTocWidth(0); }
  }
  tocTopToggle.addEventListener("click", toggleToc);
  splitter.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    draggingSplitter = true;
    splitter.classList.add("dragging");
    document.body.classList.add("dragging");
    layout.classList.add("no-transition");
    if (splitter.setPointerCapture) { try { splitter.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  window.addEventListener("pointermove", function (e) {
    if (!draggingSplitter) { return; }
    applyTocWidth(e.clientX - layout.getBoundingClientRect().left);
  });
  window.addEventListener("pointerup", function () {
    if (!draggingSplitter) { return; }
    draggingSplitter = false;
    splitter.classList.remove("dragging");
    document.body.classList.remove("dragging");
    layout.classList.remove("no-transition");
    try { localStorage.setItem(TOC_WIDTH_KEY, String(tocWidth)); } catch (e) {}
  });
  splitter.addEventListener("dblclick", function () { applyTocWidth(DEFAULT_TOC_WIDTH); });

  var savedToc = 0;
  try { savedToc = parseInt(localStorage.getItem(TOC_WIDTH_KEY) || "0", 10) || 0; } catch (e) { savedToc = 0; }
  applyTocWidth(savedToc > 0 ? savedToc : DEFAULT_TOC_WIDTH);

  /* ---------- файл ---------- */
  fileInput.addEventListener("change", function () {
    handleFiles(fileInput.files);
    fileInput.value = "";
  });

  window.addEventListener("dragenter", function (e) {
    e.preventDefault();
    dragDepth++;
    overlay.classList.add("visible");
  });
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("dragleave", function (e) {
    e.preventDefault();
    dragDepth--;
    if (dragDepth <= 0) {
      dragDepth = 0;
      overlay.classList.remove("visible");
    }
  });
  window.addEventListener("drop", function (e) {
    e.preventDefault();
    dragDepth = 0;
    overlay.classList.remove("visible");
    var dt = e.dataTransfer;
    if (!dt) { return; }
    var items = dt.items;
    if (items && items.length && items[0].webkitGetAsEntry) {
      var entries = [];
      var dirs = [];
      Array.prototype.forEach.call(items, function (it) {
        var entry = it.webkitGetAsEntry && it.webkitGetAsEntry();
        if (!entry) { return; }
        if (entry.isDirectory) { dirs.push(entry); } else { entries.push(entry); }
      });
      if (dirs.length) {
        readDroppedEntries(dirs, function (list) {
          if (list.length) { setFolderEntries(list); }
        });
        return;
      }
      if (entries.length) {
        readDroppedEntries(entries, function (list) {
          var files = list.map(function (x) { return x.file; });
          if (files.length) { handleFiles(files); }
        });
        return;
      }
    }
    if (dt.files && dt.files.length) { handleFiles(dt.files); }
  });

  function handleFiles(files) {
    if (!files || !files.length) { return; }
    var file = files[0];
    var name = file.name || "файл";
    clearFolder();
    fileOpened = true;
    updateFileButton();
    fileName.textContent = files.length > 1 ? (files.length + " файлов, открыт: " + name) : name;
    readFile(file, function (text) { render(text); });
  }
  function readFile(file, cb) {
    var reader = new FileReader();
    reader.onload = function () { cb(String(reader.result || "")); };
    reader.onerror = function () {
      content.innerHTML = '<div class="empty"><div class="big">Не удалось прочитать файл</div></div>';
    };
    reader.readAsText(file, "utf-8");
  }

  /* ---------- рабочая папка ---------- */
  var folderEntries = [];   // [{ file: File, path: "папка/подпапка/файл.md" }]
  var folderName = "";
  var currentFilePath = "";

  function isFolderOpen() { return folderName !== ""; }

  var fileOpened = false;

  function updateFileButton() {
    openBtn.innerHTML = fileOpened ? ICONS.fileFilled : ICONS.file;
  }
  function updateFolderButton() {
    openFolderBtn.innerHTML = isFolderOpen() ? ICONS.folderFilled : ICONS.folder;
  }
  openFolderBtn.addEventListener("click", function () { folderInput.click(); });

  folderInput.addEventListener("change", function () {
    if (folderInput.files && folderInput.files.length) { setFolder(folderInput.files); }
    folderInput.value = "";
  });

  function isMarkdownName(name) {
    return /\.(md|markdown|mdown|mkd|txt|text)$/i.test(name);
  }

  function setFolder(files) {
    var entries = [];
    Array.prototype.forEach.call(files || [], function (f) {
      entries.push({ file: f, path: (f.webkitRelativePath || f.name).replace(/\\/g, "/") });
    });
    setFolderEntries(entries);
  }

  function setFolderEntries(entries) {
    folderEntries = entries || [];
    folderName = "";
    if (folderEntries.length) {
      var parts = folderEntries[0].path.split("/");
      folderName = parts.length > 1 ? parts[0] : "";
    }
    updateFolderUI();
    renderFolderView();
  }

  function buildFolderTree() {
    var root = { dirs: {}, files: [] };
    folderEntries.forEach(function (en, idx) {
      var parts = en.path.split("/");
      if (parts[0] === "") { parts.shift(); }
      if (!parts.length) { return; }
      var node = root;
      for (var i = 1; i < parts.length; i++) {
        if (i === parts.length - 1) {
          node.files.push({ name: parts[i], file: en.file, idx: idx });
        } else {
          if (!node.dirs[parts[i]]) { node.dirs[parts[i]] = { dirs: {}, files: [] }; }
          node = node.dirs[parts[i]];
        }
      }
      if (parts.length === 1) { root.files.push({ name: parts[0], file: en.file, idx: idx }); }
    });
    return root;
  }

  function cmpName(a, b) {
    a = String(a).toLowerCase();
    b = String(b).toLowerCase();
    return a < b ? -1 : (a > b ? 1 : 0);
  }

  function renderFolderView() {
    if (!folderEntries.length) {
      folderEl.innerHTML = '<div class="folder-empty">Рабочая папка не выбрана.<br>Перетащите папку на страницу, чтобы увидеть её содержимое.</div>';
      return;
    }
    var root = buildFolderTree();
    var html = "";
    if (folderName) {
      html += '<div class="folder-root">' + ICONS.folderOpen + '<span class="fname">' + escapeHtml(folderName) + '</span></div>';
    }
    html += '<ul class="file-tree">' + renderFolderNodes(root) + "</ul>";
    folderEl.innerHTML = html;
  }

  function renderFolderNodes(node) {
    var out = "";
    var dirNames = Object.keys(node.dirs).sort(cmpName);
    dirNames.forEach(function (name) {
      var child = node.dirs[name];
      out += '<li class="dir closed">' +
        '<button type="button" class="dir-toggle" aria-expanded="false">' +
          '<span class="tw">\u25b8</span>' + ICONS.folder + '<span class="fname">' + escapeHtml(name) + '</span>' +
        '</button>' +
        '<ul>' + renderFolderNodes(child) + '</ul>' +
      '</li>';
    });
    var files = node.files.slice().sort(function (a, b) { return cmpName(a.name, b.name); });
    files.forEach(function (f) {
      if (isMarkdownName(f.name)) {
        out += '<li class="file">' +
          '<button type="button" class="file-btn md" data-file="' + f.idx + '" title="' + escapeHtml(f.name) + '">' +
            ICONS.file + '<span class="fname">' + escapeHtml(f.name) + '</span>' +
          '</button>' +
        '</li>';
      } else {
        out += '<li class="file">' +
          '<span class="file-other" title="' + escapeHtml(f.name) + '">' + ICONS.file + '<span class="fname">' + escapeHtml(f.name) + '</span></span>' +
        '</li>';
      }
    });
    return out;
  }

  folderEl.addEventListener("click", function (e) {
    var toggle = e.target && e.target.closest ? e.target.closest(".dir-toggle") : null;
    if (toggle) {
      var li = toggle.parentNode;
      var open = li.classList.toggle("open");
      li.classList.toggle("closed", !open);
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      return;
    }
    var btn = e.target && e.target.closest ? e.target.closest("[data-file]") : null;
    if (btn) {
      var idx = parseInt(btn.getAttribute("data-file"), 10);
      var en = folderEntries[idx];
      if (en) { openFolderFile(en); }
    }
  });

  function openFolderFile(entry) {
    currentFilePath = entry.path;
    fileOpened = true;
    updateFileButton();
    fileName.textContent = entry.path;
    readFile(entry.file, function (text) { render(text); });
  }

  function replayAnimation(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth; // перезапуск анимации
    el.classList.add(cls);
  }

  function switchTab(tab) {
    var open = isFolderOpen();
    var folder = (tab === "folder") && open;
    tabFolder.hidden = !open;
    var tabsWrap = tabToc.parentNode;
    tabsWrap.classList.toggle("has-folder", open);
    tabsWrap.classList.toggle("folder-active", folder);
    tabToc.classList.toggle("active", !folder);
    tabFolder.classList.toggle("active", folder);
    tabToc.setAttribute("aria-selected", folder ? "false" : "true");
    tabFolder.setAttribute("aria-selected", folder ? "true" : "false");
    if (folder) {
      toc.hidden = true;
      folderEl.hidden = false;
      replayAnimation(folderEl, "panel-enter");
    } else {
      folderEl.hidden = true;
      toc.hidden = false;
      replayAnimation(toc, "panel-enter");
    }
  }
  function updateFolderUI() {
    switchTab(isFolderOpen() ? "folder" : "toc");
    updateFolderButton();
  }
  function clearFolder() {
    folderEntries = [];
    folderName = "";
    currentFilePath = "";
    updateFolderUI();
  }
  tabToc.addEventListener("click", function () { switchTab("toc"); });
  tabFolder.addEventListener("click", function () { switchTab("folder"); });

  // чтение брошенных через drag&drop папок/файлов (через FileSystem API)
  function readDroppedEntries(entries, cb) {
    var out = [];
    var pending = entries.length;
    if (!pending) { cb(out); return; }
    entries.forEach(function (entry) {
      walkEntry(entry, "", function () {
        if (--pending === 0) { cb(out); }
      });
    });

    function walkEntry(entry, basePath, done) {
      if (entry.isFile) {
        entry.file(function (file) {
          out.push({ file: file, path: basePath ? basePath + "/" + entry.name : entry.name });
          done();
        }, function () { done(); });
      } else if (entry.isDirectory) {
        var reader = entry.createReader();
        var all = [];
        (function readBatch() {
          reader.readEntries(function (batch) {
            if (!batch.length) {
              var sub = all.length;
              if (!sub) { done(); return; }
              all.forEach(function (child) {
                walkEntry(child, basePath ? basePath + "/" + entry.name : entry.name, function () {
                  if (--sub === 0) { done(); }
                });
              });
              return;
            }
            all = all.concat(Array.prototype.slice.call(batch));
            readBatch();
          }, function () { done(); });
        })();
      } else {
        done();
      }
    }
  }

  function findEntryByPath(path) {
    var norm = String(path).replace(/\\/g, "/");
    for (var i = 0; i < folderEntries.length; i++) {
      if (folderEntries[i].path === norm) { return folderEntries[i]; }
    }
    return null;
  }

  function safeDecode(s) {
    try { return decodeURIComponent(s); } catch (e) { return s; }
  }

  // подставляем blob-URL для картинок с относительными путями (в контексте рабочей папки)
  function resolveRelativeImages() {
    if (!currentFilePath || !folderEntries.length) { return; }
    var base = currentFilePath.split("/");
    base.pop();
    var baseParts = base.join("/") ? base : [];
    var imgs = content.querySelectorAll("img");
    Array.prototype.forEach.call(imgs, function (img) {
      var src = img.getAttribute("src") || "";
      if (/^(https?:|data:|blob:|file:|#)/i.test(src) || src.indexOf("//") === 0) { return; }
      var norm = safeDecode(src.split("#")[0].split("?")[0]);
      var stack = baseParts.slice();
      var seg = norm.replace(/\\/g, "/").split("/");
      seg.forEach(function (p) {
        if (!p || p === ".") { return; }
        if (p === "..") { stack.pop(); }
        else { stack.push(p); }
      });
      var entry = findEntryByPath(stack.join("/"));
      if (entry) {
        try { img.src = URL.createObjectURL(entry.file); } catch (err) {}
      }
    });
  }

  /* ---------- рендер markdown ---------- */
  function render(text) {
    content.innerHTML = marked.parse(text);
    buildToc();
    renderMermaidBlocks();
    addCodeCopyButtons();
    resolveRelativeImages();
    replayAnimation(content, "content-enter");
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function buildToc() {
    var headings = content.querySelectorAll("h1, h2, h3");
    var items = [];
    for (var i = 0; i < headings.length; i++) {
      var h = headings[i];
      var id = "sec-" + i;
      h.id = id;
      var cls = "lvl-" + h.tagName.charAt(1);
      items.push('<a class="' + cls + '" href="#' + id + '">' + escapeHtml(h.textContent) + "</a>");
    }
    toc.innerHTML = items.join("");
  }

  /* ---------- mermaid ---------- */
  function mermaidConfig() {
    return {
      startOnLoad: false,
      securityLevel: "loose",
      theme: "base",
      fontFamily: getComputedStyle(document.body).fontFamily,
      flowchart: {
        htmlLabels: true,
        wrappingWidth: 190,
        useMaxWidth: false,
        nodeSpacing: 34,
        rankSpacing: 46,
        padding: 8,
        subGraphTitleMargin: { top: 24, bottom: 8 }
      },
      sequence: { useMaxWidth: false },
      gantt: { useMaxWidth: false },
      journey: { useMaxWidth: false },
      class: { useMaxWidth: false },
      state: { useMaxWidth: false },
      er: { useMaxWidth: false },
      themeVariables: mermaidVarsFor(themeById(settings.theme))
    };
  }

  function renderMermaidBlocks() {
    var blocks = content.querySelectorAll("pre code.language-mermaid");
    if (!blocks.length) { return; }
    if (typeof mermaid === "undefined") {
      if (mermaidRetries++ < 25) {
        setTimeout(renderMermaidBlocks, 300);
      } else {
        markMermaidUnavailable(blocks);
      }
      return;
    }
    mermaid.initialize(mermaidConfig());
    Array.prototype.forEach.call(blocks, function (code) {
      var pre = code.parentNode;
      renderMermaidOne(code.textContent, null, pre);
    });
  }

  function renderMermaidOne(source, replaceBox, pre) {
    var id = "mmd-" + (++mermaidCounter) + "-" + Date.now().toString(36);
    Promise.resolve(mermaid.render(id, source)).then(function (result) {
      var box = buildMermaidBox(result.svg, source);
      if (replaceBox && replaceBox.parentNode) {
        replaceBox.parentNode.replaceChild(box, replaceBox);
      } else if (pre && pre.parentNode) {
        pre.parentNode.replaceChild(box, pre);
      }
      sizeMermaidViewport(box);
      fitMermaid(box);
    }).catch(function (err) {
      if (pre) { showMermaidError(pre, err); }
    });
  }

  function rerenderAllMermaid() {
    if (typeof mermaid === "undefined") { return; }
    var boxes = content.querySelectorAll(".mermaid-box");
    if (!boxes.length) { return; }
    mermaid.initialize(mermaidConfig());
    Array.prototype.forEach.call(boxes, function (box) {
      var source = box._mermaidSource || "";
      if (!source) { return; }
      renderMermaidOne(source, box, null);
    });
  }

  function showMermaidError(pre, err) {
    var msg = document.createElement("div");
    msg.className = "mermaid-error";
    msg.textContent = "Ошибка Mermaid: " + (err && err.message ? err.message : err);
    pre.insertAdjacentElement("beforebegin", msg);
  }

  function markMermaidUnavailable(blocks) {
    Array.prototype.forEach.call(blocks, function (code) {
      var note = document.createElement("div");
      note.className = "mermaid-error";
      note.textContent = "Mermaid не загрузился (нет интернета?). Ниже - исходный код диаграммы.";
      code.parentNode.insertAdjacentElement("beforebegin", note);
    });
  }

  function buildMermaidBox(svg, source) {
    var box = document.createElement("div");
    box.className = "mermaid-box";
    box._scale = 1;
    box._mermaidSource = source || "";
    box.innerHTML =
      '<div class="mermaid-toolbar">' +
        '<button type="button" data-act="zoom-out" title="Отдалить">' + ICONS.zoomOut + '</button>' +
        '<button type="button" data-act="zoom-reset" class="pct" title="Сбросить масштаб (100%)">100%</button>' +
        '<button type="button" data-act="zoom-in" title="Приблизить">' + ICONS.zoomIn + '</button>' +
        '<button type="button" data-act="fit" title="Вписать диаграмму в блок">' + ICONS.fit + '</button>' +
        '<button type="button" data-act="fullscreen" title="На весь экран">' + ICONS.fullscreen + '</button>' +
        '<span class="sep"></span>' +
        '<button type="button" data-act="copy-png" title="Скопировать как PNG">' + ICONS.image + '</button>' +
        '<button type="button" data-act="copy-svg" title="Скопировать как SVG">' + ICONS.code + '</button>' +
        '<button type="button" data-act="copy-mmd" title="Скопировать исходник Mermaid">' + ICONS.terminal + '</button>' +
        '<span class="hint">колесо с Ctrl - зум, перетаскивание - панорама</span>' +
      "</div>" +
      '<div class="mermaid-viewport"><div class="mermaid-inner">' + svg + "</div></div>";

    normalizeSvg(box);
    decorateNodes(box);
    bindToolbar(box);
    bindPanning(box);
    bindNodeTips(box);
    return box;
  }

  function diagramSvg(box) {
    return box.querySelector(".mermaid-inner svg");
  }

  function normalizeSvg(box) {
    var svg = diagramSvg(box);
    if (!svg) { return; }
    var vb = svg.viewBox && svg.viewBox.baseVal;
    if (vb && vb.width && vb.height) {
      svg.setAttribute("width", vb.width);
      svg.setAttribute("height", vb.height);
    }
    svg.style.maxWidth = "none";
  }

  function naturalSize(box) {
    var svg = diagramSvg(box);
    if (!svg) { return { w: 800, h: 600 }; }
    var vb = svg.viewBox && svg.viewBox.baseVal;
    if (vb && vb.width && vb.height) { return { w: vb.width, h: vb.height }; }
    return {
      w: parseFloat(svg.getAttribute("width")) || 800,
      h: parseFloat(svg.getAttribute("height")) || 600
    };
  }

  function sizeMermaidViewport(box) {
    var vp = box.querySelector(".mermaid-viewport");
    if (!vp) { return; }
    var n = naturalSize(box);
    var maxH = Math.max(300, Math.min(520, Math.round(window.innerHeight * 0.56)));
    var h = Math.max(240, Math.min(maxH, n.h + 40));
    vp.style.height = h + "px";
  }

  function applyMermaidScale(box) {
    var inner = box.querySelector(".mermaid-inner");
    if (!inner) { return; }
    inner.style.zoom = box._scale;
    var btn = box.querySelector('[data-act="zoom-reset"]');
    if (btn) { btn.textContent = Math.round(box._scale * 100) + "%"; }
  }

  function fitMermaid(box) {
    var vp = box.querySelector(".mermaid-viewport");
    if (!vp) { return; }
    var n = naturalSize(box);
    var sx = (vp.clientWidth - 34) / n.w;
    var sy = (vp.clientHeight - 34) / n.h;
    box._scale = Math.max(0.08, Math.min(1, Math.min(sx, sy)));
    box._atFit = true;
    applyMermaidScale(box);
    vp.scrollLeft = Math.max(0, (vp.scrollWidth - vp.clientWidth) / 2);
    vp.scrollTop = Math.max(0, (vp.scrollHeight - vp.clientHeight) / 2);
  }

  function handleMermaidAction(box, act) {
    if (act === "zoom-in") {
      box._scale = Math.min(8, box._scale * 1.25);
      box._atFit = false;
      applyMermaidScale(box);
    } else if (act === "zoom-out") {
      box._scale = Math.max(0.08, box._scale / 1.25);
      box._atFit = false;
      applyMermaidScale(box);
    } else if (act === "zoom-reset") {
      box._scale = 1;
      box._atFit = false;
      applyMermaidScale(box);
    } else if (act === "fit") {
      fitMermaid(box);
    } else if (act === "fullscreen") {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(function () {});
      } else if (box.requestFullscreen) {
        box.requestFullscreen().catch(function () { toast("Не удалось открыть на весь экран"); });
      }
    } else if (act === "copy-png") {
      svgToPngBlob(diagramSvg(box), function (blob) {
        if (blob) { copyPng(blob); } else { toast("Не удалось подготовить PNG"); }
      });
    } else if (act === "copy-svg") {
      copyText(new XMLSerializer().serializeToString(diagramSvg(box)), "SVG скопирован в буфер");
    } else if (act === "copy-mmd") {
      copyText(box._mermaidSource || "", "Код Mermaid скопирован в буфер");
    }
  }

  function bindToolbar(box) {
    box.querySelector(".mermaid-toolbar").addEventListener("click", function (e) {
      var btn = e.target && e.target.closest ? e.target.closest("button[data-act]") : null;
      if (!btn) { return; }
      handleMermaidAction(box, btn.getAttribute("data-act"));
    });
  }

  function bindPanning(box) {
    var vp = box.querySelector(".mermaid-viewport");
    var state = null;
    vp.addEventListener("pointerdown", function (e) {
      if (e.button !== 0) { return; }
      state = { x: e.clientX, y: e.clientY, sl: vp.scrollLeft, st: vp.scrollTop, moved: false };
      vp.classList.add("panning");
      if (vp.setPointerCapture) { try { vp.setPointerCapture(e.pointerId); } catch (err) {} }
      e.preventDefault();
    });
    vp.addEventListener("pointermove", function (e) {
      if (!state) { return; }
      var dx = e.clientX - state.x;
      var dy = e.clientY - state.y;
      if (!state.moved && Math.abs(dx) + Math.abs(dy) < 4) { return; }
      state.moved = true;
      vp.scrollLeft = state.sl - dx;
      vp.scrollTop = state.st - dy;
    });
    function endPan() {
      state = null;
      vp.classList.remove("panning");
    }
    vp.addEventListener("pointerup", endPan);
    vp.addEventListener("pointercancel", endPan);
    vp.addEventListener("dblclick", function () { fitMermaid(box); });
    vp.addEventListener("wheel", function (e) {
      if (!e.ctrlKey) { return; }
      e.preventDefault();
      box._atFit = false;
      if (e.deltaY < 0) { box._scale = Math.min(8, box._scale * 1.15); }
      else { box._scale = Math.max(0.08, box._scale / 1.15); }
      applyMermaidScale(box);
    }, { passive: false });
  }

  /* ---------- полный текст узла при наведении ---------- */
  function nodeLabelText(g) {
    var label = g.querySelector(".nodeLabel");
    if (label) {
      var clone = label.cloneNode(true);
      Array.prototype.forEach.call(clone.querySelectorAll("br"), function (br) {
        br.parentNode.replaceChild(document.createTextNode("\n"), br);
      });
      Array.prototype.forEach.call(clone.querySelectorAll("p, div, li"), function (el) {
        el.appendChild(document.createTextNode("\n"));
      });
      var text = clone.textContent || "";
      return text
        .replace(/\u00a0/g, " ")
        .replace(/[ \t]+/g, " ")
        .replace(/ *\n */g, "\n")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
    }
    var t = g.querySelector("text");
    return t ? t.textContent.replace(/\s+/g, " ").trim() : "";
  }

  function decorateNodes(box) {
    var svg = diagramSvg(box);
    if (!svg) { return; }
    Array.prototype.forEach.call(svg.querySelectorAll("g.node"), function (g) {
      var label = g.querySelector(".nodeLabel");
      if (label) {
        label.classList.add("mdv-clamped");
        var p = label.querySelector("p");
        if (p) { p.classList.add("mdv-clamped-p"); }
      }
      var full = nodeLabelText(g);
      if (full) { g.setAttribute("data-full-label", full); }
    });
    // подписи подграфов (subgraph)
    Array.prototype.forEach.call(svg.querySelectorAll(".cluster"), function (cl) {
      var lbl = cl.querySelector(".cluster-label .nodeLabel") || cl.querySelector(".nodeLabel") || cl.querySelector(".cluster-label") || cl.querySelector("text");
      if (lbl) {
        var full = (lbl.textContent || "").replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim();
        if (full) { cl.setAttribute("data-full-label", full); }
      }
    });
  }

  function bindNodeTips(box) {
    var svg = diagramSvg(box);
    if (!svg) { return; }
    svg.addEventListener("pointerover", function (e) {
      if (!settings.tooltips) { return; }
      var el = e.target && e.target.closest ? e.target.closest("[data-full-label]") : null;
      if (!el) { return; }
      var full = el.getAttribute("data-full-label");
      if (!full) { return; }
      showNodeTip(full, e.clientX, e.clientY);
    });
    svg.addEventListener("pointermove", function (e) {
      if (nodeTip.classList.contains("show")) { placeNodeTip(e.clientX, e.clientY); }
    });
    svg.addEventListener("pointerout", function (e) {
      var el = e.target && e.target.closest ? e.target.closest("[data-full-label]") : null;
      if (el) { hideNodeTip(); }
    });
    svg.addEventListener("pointerleave", hideNodeTip);
    window.addEventListener("scroll", hideNodeTip, { passive: true });
  }

  function showNodeTip(text, x, y) {
    nodeTip.textContent = text;
    nodeTip.classList.add("show");
    placeNodeTip(x, y);
  }
  function placeNodeTip(x, y) {
    var pad = 14;
    var rect = nodeTip.getBoundingClientRect();
    var left = x + pad;
    var top = y + pad;
    if (left + rect.width > window.innerWidth - 8) { left = Math.max(8, x - rect.width - pad); }
    if (top + rect.height > window.innerHeight - 8) { top = Math.max(8, y - rect.height - pad); }
    nodeTip.style.left = left + "px";
    nodeTip.style.top = top + "px";
  }
  function hideNodeTip() { nodeTip.classList.remove("show"); }

  /* ---------- копирование ---------- */
  function addCodeCopyButtons() {
    var pres = content.querySelectorAll("pre");
    Array.prototype.forEach.call(pres, function (pre) {
      var code = pre.querySelector("code");
      if (!code) { return; }
      if (code.className && code.className.indexOf("language-mermaid") !== -1) { return; }
      if (pre.parentNode && pre.parentNode.classList && pre.parentNode.classList.contains("code-block")) { return; }
      var wrapper = document.createElement("div");
      wrapper.className = "code-block";
      pre.parentNode.insertBefore(wrapper, pre);
      wrapper.appendChild(pre);
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "code-copy";
      btn.innerHTML = ICONS.copy;
      btn.title = "Копировать код";
      btn.setAttribute("aria-label", "Копировать код");
      wrapper.appendChild(btn);
      btn.addEventListener("click", function () {
        copyText(code.textContent, "Код скопирован в буфер");
      });
    });
  }

  function svgToPngBlob(svg, cb) {
    if (!svg) { cb(null); return; }
    try {
      var n = { w: 0, h: 0 };
      var vb = svg.viewBox && svg.viewBox.baseVal;
      if (vb && vb.width && vb.height) { n = { w: vb.width, h: vb.height }; }
      else {
        var r = svg.getBoundingClientRect();
        n = { w: r.width || 800, h: r.height || 600 };
      }
      var scale = 2;
      var clone = svg.cloneNode(true);
      clone.setAttribute("width", n.w);
      clone.setAttribute("height", n.h);
      clone.removeAttribute("style");
      var xml = new XMLSerializer().serializeToString(clone);
      var svg64 = btoa(unescape(encodeURIComponent(xml)));
      var img = new Image();
      img.onload = function () {
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(n.w * scale);
        canvas.height = Math.round(n.h * scale);
        var ctx = canvas.getContext("2d");
        var bg = getComputedStyle(document.documentElement).getPropertyValue("--panel").trim() || "#ffffff";
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function (blob) { cb(blob); }, "image/png");
      };
      img.onerror = function () { cb(null); };
      img.src = "data:image/svg+xml;base64," + svg64;
    } catch (e) { cb(null); }
  }

  function copyText(text, okMsg) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); toast(okMsg); }
      catch (e) { toast("Не удалось скопировать"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
    } else { fallback(); }
  }

  function copyPng(blob) {
    function fallback() { downloadPng(blob); }
    if (navigator.clipboard && window.ClipboardItem && navigator.clipboard.write) {
      try {
        navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]).then(
          function () { toast("PNG скопирован в буфер"); },
          fallback
        );
      } catch (e) { fallback(); }
    } else { fallback(); }
  }

  function downloadPng(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "diagram.png";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    toast("PNG скачан файлом diagram.png");
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.remove("show");
    void toastEl.offsetWidth; // перезапуск анимации
    toastEl.classList.add("show");
    if (tipTimer) { clearTimeout(tipTimer); }
    tipTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* ---------- старт ---------- */
  // иконки кнопок верхней панели
  updateFileButton();
  settingsBtn.innerHTML = ICONS.settings;
  tocTopToggle.innerHTML = ICONS.tocActive;
  buildThemeButtons();
  applySettings(false);
  updateFolderUI();

  // пересборка размеров/масштаба при изменении окна
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    if (resizeTimer) { clearTimeout(resizeTimer); }
    resizeTimer = setTimeout(function () {
      resizeTimer = null;
      Array.prototype.forEach.call(content.querySelectorAll(".mermaid-box"), function (box) {
        sizeMermaidViewport(box);
        if (box._atFit) { fitMermaid(box); }
      });
    }, 160);
  });

  // Ctrl/Cmd+O - открыть файл
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === "o" || e.key === "O")) {
      e.preventDefault();
      fileInput.click();
    }
  });

  // в fullscreen подсказка и тост должны жить внутри полноэкранного элемента,
  // иначе они не видны (всё за пределами :fullscreen не рендерится)
  function syncOverlayHost() {
    var host = document.fullscreenElement || document.body;
    if (nodeTip.parentNode !== host) { host.appendChild(nodeTip); }
    if (toastEl.parentNode !== host) { host.appendChild(toastEl); }
  }
  document.addEventListener("fullscreenchange", syncOverlayHost);

  // для отладки и автотестов
  window.MDV = {
    render: render,
    settings: function () { return Object.assign({}, settings); },
    rerenderMermaid: rerenderAllMermaid
  };
})();
</script>
